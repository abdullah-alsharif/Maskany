name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: maskany_test
          POSTGRES_PASSWORD: maskany_test_pass
          POSTGRES_DB: maskany_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://maskany_test:maskany_test_pass@localhost:5433/maskany_test
      TEST_DATABASE_URL: postgresql://maskany_test:maskany_test_pass@localhost:5433/maskany_test
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-not-for-production
      PORT: 3001
      TWILIO_ACCOUNT_SID: ci_sid
      TWILIO_AUTH_TOKEN: ci_token
      TWILIO_PHONE_NUMBER: '+15550000000'
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_USER: ci
      SMTP_PASS: ci
      SMTP_FROM: ci@maskany.test
      UPLOADS_DIR: uploads

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:only

      - name: Coverage
        run: pnpm test:coverage

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: maskany_test
          POSTGRES_PASSWORD: maskany_test_pass
          POSTGRES_DB: maskany_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://maskany_test:maskany_test_pass@localhost:5433/maskany_test
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-not-for-production
      PORT: 3001
      TWILIO_ACCOUNT_SID: ci_sid
      TWILIO_AUTH_TOKEN: ci_token
      TWILIO_PHONE_NUMBER: '+15550000000'
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_USER: ci
      SMTP_PASS: ci
      SMTP_FROM: ci@maskany.test
      UPLOADS_DIR: uploads

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @maskany/web exec playwright install --with-deps chromium

      - name: Migrate & seed test database
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Run E2E tests
        run: pnpm --filter @maskany/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  perf-api:
    name: API performance tests (k6)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: maskany_test
          POSTGRES_PASSWORD: maskany_test_pass
          POSTGRES_DB: maskany_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://maskany_test:maskany_test_pass@localhost:5433/maskany_test
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-not-for-production
      PORT: 3001

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Seed performance data
        run: pnpm tsx scripts/seed-k6.ts --truncate

      - name: Build API
        run: pnpm --filter @maskany/api build

      - name: Start API
        run: |
          pnpm --filter @maskany/api dev &
          sleep 5

      - uses: grafana/setup-k6-action@v1

      - name: Run k6 smoke test
        run: k6 run apps/api/tests/performance/k6/smoke-test.js

      - name: Run k6 load test
        run: k6 run apps/api/tests/performance/k6/load-test.js

  perf-web:
    name: Web performance audits (Lighthouse CI)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: LHCI Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: apps/web/tests/performance/lighthouse/lighthouserc.cjs
          budgetPath: apps/web/tests/performance/lighthouse/budgets.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  deploy:
    name: Build & deploy Docker images
    runs-on: ubuntu-latest
    needs: [check, e2e, perf-api, perf-web]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }},ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }},ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            API_BASE_URL=${{ vars.API_BASE_URL || 'http://localhost:3001' }}
