name: maskany-test

services:
  postgres:
    image: postgres:17-alpine
    container_name: maskany-postgres-test
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: maskany_test
      POSTGRES_PASSWORD: maskany_test_pass
      POSTGRES_DB: maskany_test
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maskany_test -d maskany_test']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_test:
