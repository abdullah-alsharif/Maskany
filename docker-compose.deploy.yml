name: maskany-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: maskany-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maskany}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-maskany}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: maskany-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-maskany}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-maskany}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://maskany.com}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-noreply@maskany.com}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_prod:/app/uploads
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_BASE_URL: http://api:3001
    container_name: maskany-web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: maskany-nginx
    restart: always
    ports:
      - '80:80'
    depends_on:
      - api
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal

volumes:
  pgdata_prod:
  uploads_prod:

networks:
  internal:
    driver: bridge
