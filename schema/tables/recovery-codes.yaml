table: recovery_codes
comment: SHA-256 hashed one-time backup recovery codes for account access.
columns:
  - name: id
    type: uuid
    primary_key: true
    default: gen_random_uuid()
    nullable: false
  - name: user_id
    type: uuid
    nullable: false
    references:
      table: users
      column: id
      on_delete: CASCADE
  - name: code_hash
    type: text
    nullable: false
    comment: SHA-256 hash of the recovery code
  - name: used_at
    type: timestamptz
    nullable: true
    comment: When the code was consumed (null = unused)
  - name: created_at
    type: timestamptz
    nullable: false
    default: now()
indexes:
  - name: idx_recovery_codes_user
    columns: [user_id]
  - name: idx_recovery_codes_hash
    columns: [code_hash]
    unique: true
