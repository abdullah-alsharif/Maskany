table: push_tokens
comment: Device push notification tokens for registered users (T-040, PRD §7.2).
columns:
  - name: id
    type: uuid
    primary_key: true
    default: gen_random_uuid()
    nullable: false
  - name: user_id
    type: uuid
    nullable: false
    references:
      table: users
      column: id
      on_delete: CASCADE
  - name: token
    type: text
    nullable: false
  - name: platform
    type: text
    nullable: false
    check: platform IN ('ios', 'android', 'web')
  - name: created_at
    type: timestamptz
    nullable: false
    default: now()
unique_constraints:
  - name: push_tokens_token_unique
    columns: [token]
indexes:
  - name: idx_push_tokens_user
    columns: [user_id]
