table: reviews
comment: User reviews and ratings for properties.
columns:
  - name: id
    type: uuid
    primary_key: true
    default: gen_random_uuid()
    nullable: false
  - name: property_id
    type: uuid
    nullable: false
    references:
      table: properties
      column: id
      on_delete: CASCADE
  - name: user_id
    type: uuid
    nullable: false
    references:
      table: users
      column: id
      on_delete: CASCADE
  - name: rating
    type: numeric(2,1)
    nullable: false
    check: rating >= 1::numeric AND rating <= 5::numeric
  - name: comment
    type: text
    nullable: true
    check: comment IS NULL OR char_length(comment) <= 1000
  - name: created_at
    type: timestamptz
    nullable: false
    default: now()
  - name: updated_at
    type: timestamptz
    nullable: false
    default: now()
indexes:
  - name: reviews_user_property_unique
    columns: [user_id, property_id]
    unique: true
    as_constraint: true
  - name: idx_reviews_property
    columns: [property_id]
  - name: idx_reviews_user
    columns: [user_id]
  - name: idx_reviews_rating
    columns: [property_id, rating]
triggers:
  - name: trg_reviews_updated_at
    timing: BEFORE
    events: [UPDATE]
    function: set_updated_timestamp
    for_each: ROW
