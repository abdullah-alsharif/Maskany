table: properties
comment: Property listings — apartments, villas, chalets, etc.
columns:
  - name: id
    type: uuid
    primary_key: true
    default: gen_random_uuid()
    nullable: false
  - name: title
    type: text
    nullable: false
    check: char_length(title) <= 120
  - name: summary
    type: text
    nullable: true
    check: char_length(summary) <= 300
  - name: description
    type: text
    nullable: true
  - name: property_type
    type: text
    nullable: false
    check: property_type = ANY (ARRAY['APARTMENT'::text, 'ROOM'::text, 'CHALET'::text, 'VILLA'::text, 'HOUSE'::text, 'STUDIO'::text, 'PENTHOUSE'::text, 'DUPLEX'::text, 'OTHER'::text])
  - name: city
    type: text
    nullable: false
  - name: area
    type: text
    nullable: true
  - name: country
    type: text
    nullable: false
    default: "'SA'::text"
  - name: lat
    type: double precision
    nullable: true
  - name: lng
    type: double precision
    nullable: true
  - name: price
    type: numeric(12,2)
    nullable: false
    default: '0'
  - name: currency
    type: text
    nullable: false
    default: "'SAR'::text"
  - name: price_unit
    type: text
    nullable: false
    default: "'per_month'::text"
    check: price_unit = ANY (ARRAY['per_night'::text, 'per_month'::text, 'per_year'::text, 'total'::text])
  - name: rooms
    type: integer
    nullable: false
    default: '0'
  - name: bathrooms
    type: integer
    nullable: false
    default: '0'
  - name: area_sqm
    type: numeric(10,2)
    nullable: true
  - name: amenities
    type: text[]
    nullable: false
    default: 'ARRAY[]::text[]'
  - name: whatsapp_number
    type: text
    nullable: false
  - name: owner_id
    type: uuid
    nullable: false
    references:
      table: users
      column: id
      on_delete: CASCADE
  - name: status
    type: text
    nullable: false
    default: "'ACTIVE'::text"
    check: status = ANY (ARRAY['ACTIVE'::text, 'INACTIVE'::text, 'DRAFT'::text])
  - name: average_rating
    type: numeric(2,1)
    nullable: false
    default: '0'
  - name: review_count
    type: integer
    nullable: false
    default: '0'
  - name: created_at
    type: timestamptz
    nullable: false
    default: now()
  - name: updated_at
    type: timestamptz
    nullable: false
    default: now()
indexes:
  - name: idx_properties_owner
    columns: [owner_id]
  - name: idx_properties_type
    columns: [property_type]
  - name: idx_properties_city
    columns: [city]
  - name: idx_properties_status
    columns: [status]
  - name: idx_properties_price
    columns: [price]
  - name: idx_properties_rating
    columns: [average_rating]
  - name: idx_properties_created
    columns: [created_at]
triggers:
  - name: trg_properties_updated_at
    timing: BEFORE
    events: [UPDATE]
    function: set_updated_timestamp
    for_each: ROW
